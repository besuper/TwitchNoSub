name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: twitchnosub-${{ github.sha }}
          path: dist/
